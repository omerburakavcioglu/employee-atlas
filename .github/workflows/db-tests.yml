name: Database tests (RLS isolation)

# pull_request'te paths filtresi BİLEREK yok: "Database tests" zorunlu
# (required) check olduğu için her PR'da rapor vermek zorunda — filtreli
# olsaydı supabase dışı PR'lar "waiting for status" ile sonsuza dek beklerdi.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rls-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Reset database (migrations + seed)
        run: supabase db reset --local
      - name: Run pgTAP test suite
        run: supabase test db
      - name: Stop Supabase (cleanup)
        if: always()
        run: supabase stop
