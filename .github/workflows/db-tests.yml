name: Database tests (RLS isolation)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Reset database (migrations + seed)
        run: supabase db reset --local
      - name: Run pgTAP test suite
        run: supabase test db
      - name: Stop Supabase (cleanup)
        if: always()
        run: supabase stop
